<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Setup</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1c1b19; --soft: #6b6862; --line: #e4e1da;
    --ok: #1f7a4d; --ok-bg: #e3f3ea; --warn: #9a5b00; --warn-bg: #fbefd7; --bad: #b3261e; --bad-bg: #fbe4e2;
    --accent: #1c1b19; --accent-ink: #ffffff; --run: #2456c9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1e1d1b; --ink: #f1efe9; --soft: #a19d94; --line: #33312d;
      --ok: #6fd3a0; --ok-bg: #173526; --warn: #f0be62; --warn-bg: #3a2c10; --bad: #ff8a80; --bad-bg: #3d1a17;
      --accent: #f1efe9; --accent-ink: #141413; --run: #8fb0ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }
  header { margin-bottom: 22px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--soft); font-size: 13px; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 14px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--ok); width: 0; transition: width .4s; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--soft); margin: 0 0 10px; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 10px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; padding-top: 2px; }
  li:last-child { padding-bottom: 2px; }
  .row { display: flex; align-items: baseline; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .label { font-weight: 550; }
  .detail { color: var(--soft); font-size: 13px; overflow-wrap: anywhere; }
  .mono { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  a { color: inherit; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; background: var(--line); color: var(--soft); }
  .pill.done, .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.missing { background: var(--warn-bg); color: var(--warn); }
  .pill.failed { background: var(--bad-bg); color: var(--bad); }
  .pill.running { color: var(--run); }
  .pill.running::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--run); margin-right: 6px; animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .pill.running::before { animation: none; } .bar > div { transition: none; } }
  form { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  input[type=password], input[type=text] { flex: 1; min-width: 150px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }
  button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 13px; margin-top: 6px; }
  .msg.bad { color: var(--bad); }
  .msg.ok { color: var(--ok); }
  .check { width: 18px; height: 18px; accent-color: var(--ok); position: relative; top: 3px; }
  .done-text { text-decoration: line-through; color: var(--soft); }
  .note { color: var(--soft); font-size: 13px; margin: 10px 0 0; }
  .empty { color: var(--soft); font-size: 14px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Setup</h1>
    <div class="sub" id="summary"></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><div></div></div>
  </header>

  <section id="keys-section">
    <h2 id="h-keys"></h2>
    <ul id="keys"></ul>
    <p class="note" id="keys-note"></p>
  </section>

  <section id="todos-section">
    <h2 id="h-todos"></h2>
    <ul id="todos"></ul>
  </section>

  <section>
    <h2 id="h-steps"></h2>
    <ul id="steps"></ul>
  </section>
</main>

<script>
(function () {
  var token = new URLSearchParams(location.search).get("t") || "";
  var T = {
    en: {
      steps: "Progress", keys: "API keys", todos: "For you to do",
      status: { pending: "To do", running: "In progress", done: "Done", skipped: "Skipped", failed: "Failed" },
      waiting: "Waiting for the key ", ready: "Key received. Tell Claude to carry on with this step.", waitPill: "Waiting for you",
      inVault: "In the vault", missing: "Missing", create: "Create the key", paste: "Paste the key", add: "Add to the vault",
      replace: "Replace", saved: "Saved in the vault.", failedSave: "The vault refused the key. Check that `vercel login` is still valid, then try again.",
      vaultDown: "The vault cannot be reached, so keys cannot be added from here.", other: "Another key", name: "NAME_IN_CAPITALS",
      badName: "A name in capitals, digits and underscores, for example STRIPE_SECRET_KEY.",
      keysNote: "A key goes straight from this page to your vault. It is not shown again, and it never passes through the chat.",
      copy: "Copy", copied: "Copied", open: "Open", noSteps: "Nothing has started yet.", sumDone: " of ", sumSteps: " steps done", sending: "Sending...",
      noTodos: "Nothing for now."
    },
    fr: {
      steps: "Avancement", keys: "Clés API", todos: "À faire de ton côté",
      status: { pending: "À faire", running: "En cours", done: "Fait", skipped: "Passé", failed: "Échec" },
      waiting: "En attente de la clé ", ready: "Clé reçue. Dis à Claude de reprendre cette étape.", waitPill: "En attente de toi",
      inVault: "Dans le coffre", missing: "Manquante", create: "Créer la clé", paste: "Coller la clé", add: "Ajouter au coffre",
      replace: "Remplacer", saved: "Enregistrée dans le coffre.", failedSave: "Le coffre a refusé la clé. Vérifie que `vercel login` est toujours valide, puis réessaie.",
      vaultDown: "Le coffre est injoignable : impossible d'ajouter une clé depuis cette page.", other: "Une autre clé", name: "NOM_EN_MAJUSCULES",
      badName: "Un nom en majuscules, chiffres et tirets bas, par exemple STRIPE_SECRET_KEY.",
      keysNote: "Une clé va directement de cette page à ton coffre. Elle n'est plus affichée ensuite et ne passe jamais par le chat.",
      copy: "Copier", copied: "Copié", open: "Ouvrir", noSteps: "Rien n'a encore démarré.", sumDone: " sur ", sumSteps: " étapes faites", sending: "Envoi...",
      noTodos: "Rien pour l'instant."
    }
  };
  var t = T.en;
  var busy = false;       // a key is being sent: do not redraw the form under the user
  var lastDrawn = "";

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function safeUrl(u) { return /^https:\/\//.test(u || "") ? u : null; }
  function link(u, text) {
    var a = el("a", null, text);
    a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer";
    return a;
  }
  function api(path, body) {
    return fetch(path, {
      method: body ? "POST" : "GET",
      headers: { "x-panel-token": token, "content-type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, data: j }; }); });
  }

  function keyForm(name, askName, hasValue) {
    var form = el("form");
    var nameInput = null;
    if (askName) {
      nameInput = el("input"); nameInput.type = "text"; nameInput.placeholder = t.name;
      nameInput.autocomplete = "off"; nameInput.spellcheck = false; nameInput.setAttribute("aria-label", t.name);
      form.appendChild(nameInput);
    }
    var input = el("input"); input.type = "password"; input.placeholder = t.paste;
    input.autocomplete = "off"; input.setAttribute("aria-label", t.paste + (name ? " " + name : ""));
    var btn = el("button", "primary", hasValue ? t.replace : t.add); btn.type = "submit";
    var msg = el("div", "msg"); msg.setAttribute("role", "status");
    form.appendChild(input); form.appendChild(btn);
    var wrap = el("div"); wrap.appendChild(form); wrap.appendChild(msg);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var keyName = (nameInput ? nameInput.value : name).trim().toUpperCase();
      if (!/^[A-Z][A-Z0-9_]{1,63}$/.test(keyName)) { msg.className = "msg bad"; msg.textContent = t.badName; return; }
      if (!input.value.trim()) { input.focus(); return; }
      busy = true; btn.disabled = true; msg.className = "msg"; msg.textContent = t.sending;
      api("/api/key", { name: keyName, value: input.value }).then(function (r) {
        input.value = "";
        busy = false; btn.disabled = false;
        if (r.ok) { msg.className = "msg ok"; msg.textContent = t.saved; if (nameInput) nameInput.value = ""; setTimeout(function () { lastDrawn = ""; load(true); }, 900); }
        else { msg.className = "msg bad"; msg.textContent = r.data.error === "name" ? t.badName : t.failedSave; }
      }).catch(function () { input.value = ""; busy = false; btn.disabled = false; msg.className = "msg bad"; msg.textContent = t.failedSave; });
    });
    return wrap;
  }

  function draw(s) {
    t = T[s.lang] || T.en;
    document.documentElement.lang = s.lang || "en";
    document.title = s.name + " - setup";
    document.getElementById("title").textContent = s.name;
    document.getElementById("h-steps").textContent = t.steps;
    document.getElementById("h-keys").textContent = t.keys;
    document.getElementById("h-todos").textContent = t.todos;

    // steps
    var steps = document.getElementById("steps"); steps.textContent = "";
    var counted = s.steps.filter(function (x) { return x.status !== "skipped"; });
    var done = counted.filter(function (x) { return x.status === "done"; }).length;
    var pct = counted.length ? Math.round(100 * done / counted.length) : 0;
    document.querySelector("#bar > div").style.width = pct + "%";
    document.getElementById("bar").setAttribute("aria-valuenow", pct);
    document.getElementById("summary").textContent = counted.length ? done + t.sumDone + counted.length + t.sumSteps : t.noSteps;
    s.steps.forEach(function (x) {
      var li = el("li"), row = el("div", "row"), grow = el("div", "grow");
      grow.appendChild(el("div", "label", x.label || x.id));
      if (x.detail) grow.appendChild(el("div", "detail", x.detail));
      // What the step is waiting for is worked out from the vault, so it is never stale.
      var open = x.status === "pending" || x.status === "running";
      var lacking = Array.isArray(s.vault) && open ? (x.needs || []).filter(function (n) { return s.vault.indexOf(n) === -1; }) : [];
      if (lacking.length) grow.appendChild(el("div", "detail", t.waiting + lacking.join(", ")));
      else if (x.status === "pending" && (x.needs || []).length && Array.isArray(s.vault)) grow.appendChild(el("div", "msg ok", t.ready));
      if (safeUrl(x.url)) { var d = el("div", "detail"); d.appendChild(link(x.url, x.url.replace(/^https:\/\//, ""))); grow.appendChild(d); }
      row.appendChild(grow);
      if (lacking.length) row.appendChild(el("span", "pill missing", t.waitPill));
      else row.appendChild(el("span", "pill " + x.status, t.status[x.status] || x.status));
      li.appendChild(row); steps.appendChild(li);
    });

    // keys
    var keys = document.getElementById("keys"); keys.textContent = "";
    var vaultUp = Array.isArray(s.vault);
    s.keys.forEach(function (k) {
      var present = vaultUp && s.vault.indexOf(k.id) !== -1;
      var li = el("li"), row = el("div", "row"), grow = el("div", "grow");
      var label = el("div", "label", k.label || k.id);
      grow.appendChild(label);
      grow.appendChild(el("div", "detail mono", k.id));
      if (k.note) grow.appendChild(el("div", "detail", k.note));
      row.appendChild(grow);
      if (vaultUp) row.appendChild(el("span", "pill " + (present ? "ok" : "missing"), present ? t.inVault : t.missing));
      li.appendChild(row);
      if (vaultUp && !present) {
        if (safeUrl(k.url)) { var d = el("div", "detail"); d.appendChild(link(k.url, t.create + " ↗")); li.appendChild(d); }
        li.appendChild(keyForm(k.id, false, false));
      }
      keys.appendChild(li);
    });
    if (vaultUp) {
      var other = el("li");
      other.appendChild(el("div", "label", t.other));
      other.appendChild(keyForm("", true, false));
      keys.appendChild(other);
    }
    document.getElementById("keys-note").textContent = vaultUp ? t.keysNote : t.vaultDown;

    // todos
    var todos = document.getElementById("todos"); todos.textContent = "";
    if (!s.todos.length) todos.appendChild(el("li", "empty", t.noTodos));
    s.todos.forEach(function (x) {
      var li = el("li"), row = el("div", "row"), grow = el("div", "grow");
      var box = el("input", "check"); box.type = "checkbox"; box.checked = !!x.done; box.id = "todo-" + x.id;
      box.addEventListener("change", function () { api("/api/todo", { id: x.id, done: box.checked }).then(function () { lastDrawn = ""; load(); }); });
      var lab = el("label", "label" + (x.done ? " done-text" : ""), x.label || x.id); lab.htmlFor = box.id;
      grow.appendChild(lab);
      if (x.detail) grow.appendChild(el("div", "detail", x.detail));
      row.appendChild(box); row.appendChild(grow);
      if (safeUrl(x.url)) { var open = link(x.url, t.open + " ↗"); open.className = "detail"; row.appendChild(open); }
      if (x.copy) {
        var copy = el("button", null, t.copy); copy.type = "button";
        copy.addEventListener("click", function () {
          navigator.clipboard.writeText(x.copy).then(function () { copy.textContent = t.copied; setTimeout(function () { copy.textContent = t.copy; }, 1500); });
        });
        row.appendChild(copy);
      }
      li.appendChild(row); todos.appendChild(li);
    });
  }

  function typing() {
    var a = document.activeElement;
    return a && a.tagName === "INPUT" && a.type !== "checkbox" && a.value !== "";
  }
  function pendingInput() {
    return Array.prototype.some.call(document.querySelectorAll("input[type=password], input[type=text]"), function (i) { return i.value !== ""; });
  }
  function load(refresh) {
    api("/api/state" + (refresh ? "?refresh=1" : "")).then(function (r) {
      if (!r.ok) return;
      var snapshot = JSON.stringify(r.data);
      // Redraw only when something changed, and never while the user is typing a key.
      if (snapshot === lastDrawn || busy || typing() || pendingInput()) return;
      lastDrawn = snapshot; draw(r.data);
    }).catch(function () {});
  }
  load(true);
  setInterval(load, 2000);
})();
</script>
</body>
</html>
